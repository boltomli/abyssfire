<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="渊火" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Abyssfire - 渊火</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0a0a12;
        overscroll-behavior: none;
      }
      html.touch, html.touch body {
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Keep the canvas clear of notches and the home indicator. */
      #game-container {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #rotate-hint {
        position: fixed; inset: 0; z-index: 10;
        display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at 50% 40%, #2a1408 0%, #0a0a12 70%);
        color: #f0d9a8; font-family: "Noto Sans SC", sans-serif; text-align: center;
      }
      #rotate-hint.show { display: flex; }
      #rotate-hint .rotate-phone {
        width: 54px; height: 92px; border: 4px solid #e0a64a; border-radius: 10px;
        box-shadow: 0 0 24px rgba(255, 140, 40, 0.45); padding: 6px;
        animation: rotate-phone 2.2s ease-in-out infinite;
      }
      #rotate-hint .rotate-screen {
        width: 100%; height: 100%; border-radius: 3px;
        background: linear-gradient(160deg, #ffb347, #b3401a);
      }
      #rotate-hint .rotate-title { font-size: 22px; font-weight: bold; letter-spacing: 2px; margin-top: 18px; }
      #rotate-hint .rotate-body { font-size: 14px; color: #a89a86; }
      @keyframes rotate-phone {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
